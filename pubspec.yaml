name: changepay_theme
description: ChangePay theme and brand tokens (colors, type, spacing, motion, fonts) shared by every ChangePay app.
version: 0.0.2

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # Brand fonts (OFL). Reference with CpFonts.* — CpType already sets package: 'changepay_theme'.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: brand/fonts/ttf/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: brand/fonts/ttf/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: brand/fonts/ttf/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: brand/fonts/ttf/Inter-Regular.ttf
          weight: 400
        - asset: brand/fonts/ttf/Inter-Medium.ttf
          weight: 500
        - asset: brand/fonts/ttf/Inter-SemiBold.ttf
          weight: 600
        - asset: brand/fonts/ttf/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: brand/fonts/ttf/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: brand/fonts/ttf/JetBrainsMono-SemiBold.ttf
          weight: 600
